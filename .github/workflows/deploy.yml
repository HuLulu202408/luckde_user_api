
name: Build and Deploy FastAPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # 第一阶段：构建镜像并推送到 GHCR
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}

  # 第二阶段：在 B 电脑自动部署
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy FastAPI
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          DEPLOY_DIR="/Users/hu/ServerPlatform/api"

          cd "$DEPLOY_DIR"

          echo "Pulling latest FastAPI image..."
          docker compose pull fastapi

          echo "Updating FastAPI container..."
          docker compose up -d --no-deps fastapi

          # /ready 会真实探测 MySQL 与 Redis；依赖不可用时发布会直接失败，
          # 避免「进程活着但服务不可用」被误判为发布成功。
          echo "Waiting for API readiness check (/ready)..."
          ready=0
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8000/ready 2>/dev/null); then
              echo "Ready: $body"
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Deployment failed: readiness check timeout"
            echo "Last /ready response:"
            curl -s http://127.0.0.1:8000/ready || true
            echo ""
            docker compose logs --tail=100 fastapi
            exit 1
          fi

          echo "Deployment successful!"

