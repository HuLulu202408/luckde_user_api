
name: Build and Deploy FastAPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # 第一阶段：构建镜像并推送到 GHCR
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}

  # 第二阶段：在 B 电脑自动部署
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy FastAPI
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          DEPLOY_DIR="/Users/hu/ServerPlatform/api"

          cd "$DEPLOY_DIR"

          echo "Pulling latest FastAPI image..."
          docker compose pull fastapi

          echo "Updating FastAPI container..."
          docker compose up -d --no-deps fastapi

          echo "Waiting for API health check..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              echo "Deployment successful!"
              exit 0
            fi

            sleep 2
          done

          echo "Deployment failed: health check timeout"
          docker compose logs --tail=100 api
          exit 1

